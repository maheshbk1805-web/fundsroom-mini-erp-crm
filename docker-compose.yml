version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fundsroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: fundsroom_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fundsroom-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/fundsroom_erp
      JWT_SECRET: fundsroom-production-secret-2026
      CLIENT_URL: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fundsroom-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
